name: Ingest priority GDELT categories

# Added 2026-09-09 in response to a real coverage gap: user asked why
# India/Pakistan/South Asia, Central Asia, and West Africa weren't showing
# up on the map. Root cause — political-instability/humanitarian are the
# ONLY GDELT queries broad enough to ever catch that content (the five
# other CATEGORY_QUERIES are hardcoded to named flashpoints), but the main
# /api/ingest rotation (triggered by cron-job.org, see that route's own
# comment) can only afford ONE GDELT category per cycle — cron-job.org
# enforces a hard, un-raisable 30s request timeout, and a single GDELT
# query already takes up to ~23.5s. That left political-instability/
# humanitarian running once every ~7 rotation cycles (~105 min), not every
# cycle — this app's only path into these regions, structurally starved.
#
# This workflow calls the same /api/ingest route with ?priority=1, which
# runs PRIORITY_GDELT_QUERIES (src/lib/categories.ts) instead of the normal
# rotation and skips every other source (see runIngest's priorityGdelt
# option) — safe to run several GDELT queries sequentially here
# specifically because GitHub Actions has no 30s constraint, only this
# job's own 6-minute timeout below. Offset from ingest.yml's own schedule
# (4,19,34,49) so the two don't compete for GDELT's own rate limit at the
# same moment.
#
# 2026-09-10: confirmed live (gh workflow list / gh run list) that this
# schedule registered as "active" but never fired a single scheduled run
# in the hours since it was created — the EXACT same failure mode
# ingest.yml's own header comment already documents happening to it
# (silently not firing for over a week despite showing active). Same
# fix applied: change the cron expression to force GitHub to re-register
# the schedule. A manual workflow_dispatch run in the meantime confirmed
# the underlying route/logic itself works fine (real GDELT queries,
# real — if GDELT-rate-limited — results) — this was purely a dead
# schedule registration, not a code bug.
on:
  schedule:
    - cron: "9,24,39,54 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ingest-priority:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/ingest?priority=1
        run: |
          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -X GET "https://geopulse-green.vercel.app/api/ingest?priority=1" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $status"
          cat /tmp/body.txt
          if [ "$status" -ge 300 ]; then
            echo "Priority ingest request failed"
            exit 1
          fi
