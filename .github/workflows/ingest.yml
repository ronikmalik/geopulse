name: Ingest live events

# The primary ingest cadence. Since 2026-09-19 this runs runIngest()
# IN-PROCESS on the Actions runner (see _run-job.yml and
# scripts/run-job.ts) instead of curl-ing /api/ingest on Vercel — the
# Vercel route still exists as a manual/fallback entry point (and as the
# once-daily vercel.ts floor), but the scheduled work no longer spends
# Vercel's metered compute.
#
# 2026-09-20: review-pending runs as a second job right after ingest
# (rather than on its own, independently-jittered schedule — see
# review-pending.yml) so RSS/Telegram/GDELT rows are reviewed ~1 min after
# they're inserted instead of 0-15 min later at random. GitHub starts a
# scheduled run a median ~10 min after its slot and drops ~4% of slots; a
# consistent delay is harmless, but two uncoordinated schedules were not.
#
# 2026-09-21: back to every 15 min, with generate-briefs chained as the
# THIRD job, so the whole pipeline touches the database in one burst four
# times an hour. Why: Neon's Free plan is 100 CU-hours/month, i.e. the
# compute must be asleep ~11 h/day, and it only suspends after 5 idle
# minutes — a 10-minute ingest cadence plus briefs on their own offsets
# left it awake ~40 min of every hour before a single viewer showed up.
# One 15-minute burst leaves ~10 idle minutes between cycles. Feed
# latency goes back to ~15 min batches (still reviewed ~1 min after
# insert); the daily Gemini caps in src/lib/aiUsage.ts are unchanged.
#
# History worth keeping: this schedule did not fire even once between
# 2026-08-27 and 2026-09-04 despite showing "active"; changing the cron
# expression forced GitHub to re-register it and it has fired reliably
# since. If it ever goes quiet again, that is the fix — edit the minutes.
#
# cron-job.org used to be the primary trigger for the same route, at
# :00/:15/:30/:45, on top of this workflow at :04/:19/:34/:49 and a self-
# trigger from the old SSE stream — three overlapping schedulers were why
# /api/ingest ran ~260x/day instead of ~96x. Those are off; this is now
# the only scheduler apart from the daily Vercel floor.
# Two schedules, not one (2026-09-21): the Neon Free compute allowance was
# at 80% with 20 CU-hours left for the last ten days of September, and when
# it runs out Neon SUSPENDS the compute until the next billing period — the
# site would go dark, not degrade. The compute is already pinned at 0.25
# CU, so wake-ups are the only lever: every one costs the burst plus a
# fixed 5 idle minutes before suspend, so a 30-minute cycle is ~20% duty
# (~1.2 CU-hours/day) against ~40% (~2.4/day) at 15 minutes.
#
# 2026-10-08: every 30 minutes, permanently. From Oct 3 06:12 UTC the
# 15-minute cron fired only every 3-7 hours (13 runs in 5 days) while each
# run it did start succeeded, Gemini review included, so the pipeline now
# re-dispatches itself (the `next` job) and the cron is only the backstop.
# 30, not 15: measured on the Oct 8 runs, a cycle keeps the database busy
# ~2.5 min, plus Neon's fixed 5 idle minutes, i.e. ~50% duty at 15 min
# (~3 CU-h/day, ~93/month) against the Free plan's 100 CU-h, and running
# out suspends the database for the rest of the month. 30 min is ~25%
# (~1.5/day). Nothing collected shrinks: GDELT reads a 75-minute window
# of files (gdeltBulk.ts), the title drain takes 200 a cycle against ~160
# new, RSS feeds keep hours of items, and every Gemini cap is per day.
# Minutes :07/:37 keep clear of the top of the hour, GitHub's busiest slot.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# One pipeline run at a time, and at most one waiting (GitHub cancels an
# older pending run when a newer one queues). This is what keeps the
# self-dispatch below from ever forking into two chains: a schedule firing
# mid-chain just takes the waiting slot.
concurrency:
  group: ingest-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: ingest
      timeout-minutes: 10
    secrets: inherit

  # Runs after ingest whether or not ingest succeeded (a partial ingest
  # still leaves pending rows worth reviewing; only a cancelled run skips
  # it). Its own concurrency group in _run-job.yml queues it behind any
  # manual review-pending dispatch rather than running two at once.
  review-pending:
    needs: ingest
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_run-job.yml
    with:
      job: review-pending
      timeout-minutes: 6
    secrets: inherit

  # One country brief per cycle (see src/lib/countryBriefs.ts; the 50/day
  # cap in src/lib/aiUsage.ts is what stops it). Chained here since
  # 2026-09-21 so it rides the same database wake-up as ingest instead of
  # waking it on its own offset — see generate-briefs.yml.
  generate-briefs:
    needs: review-pending
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_run-job.yml
    with:
      job: generate-briefs
      timeout-minutes: 6
    secrets: inherit

  # Self-dispatch (2026-10-08). GitHub's scheduler delayed this repo's
  # cron triggers by 3-7 hours for days at a time (daily-snapshots' 18:00
  # slot started at 22:25-23:56 the same week), but workflow_dispatch
  # starts within seconds. So each run queues its successor for 30 minutes
  # after its own start; the cron above stays as the backstop that
  # restarts the chain if a run is cancelled or GitHub drops a dispatch.
  # Waiting on the runner costs nothing on a public repo. Skipped when
  # another ingest run is already waiting, so there is only ever one
  # chain. Off switch: set the repo variable INGEST_CHAIN to "off".
  #
  # It also keeps the repo's schedules alive while nobody commits. GitHub
  # disables scheduled workflows in a public repo after 60 days without
  # repository activity, silently, and a disabled workflow cannot be
  # dispatched either, so this chain would stop with them. Two layers:
  # re-enable every workflow GitHub did not see disabled by hand (the
  # enable call is what keepalive actions use, and it also revives one
  # already disabled for inactivity), and if the branch has had no commit
  # for 50 days, commit a one-line date stamp to .github/keepalive.
  next:
    needs: generate-briefs
    if: ${{ !cancelled() && vars.INGEST_CHAIN != 'off' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Keep workflows enabled
        continue-on-error: true
        run: |
          gh api "repos/$GH_REPO/actions/workflows" --paginate \
            --jq '.workflows[] | select(.state != "disabled_manually") | "\(.id) \(.state) \(.path)"' |
          while read -r id state path; do
            if gh api -X PUT "repos/$GH_REPO/actions/workflows/$id/enable" >/dev/null; then
              [ "$state" = "active" ] || echo "re-enabled $path (was $state)"
            else
              echo "::warning::could not enable $path"
            fi
          done
      - name: Commit a keepalive stamp after 50 quiet days
        continue-on-error: true
        run: |
          branch="${{ github.ref_name }}"
          last=$(gh api "repos/$GH_REPO/commits?sha=$branch&per_page=1" --jq '.[0].commit.committer.date')
          age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 86400 ))
          echo "last commit on $branch: $last ($age days ago)"
          if [ "$age" -ge 50 ]; then
            sha=$(gh api "repos/$GH_REPO/contents/.github/keepalive?ref=$branch" --jq .sha 2>/dev/null || true)
            gh api -X PUT "repos/$GH_REPO/contents/.github/keepalive" \
              -f message="Keepalive: $age days without a commit (GitHub disables schedules at 60)" \
              -f content="$(date -u +%Y-%m-%dT%H:%M:%SZ | base64)" \
              -f branch="$branch" ${sha:+-f sha="$sha"} >/dev/null
            echo "committed .github/keepalive"
          fi
      - name: Wait until 30 minutes after this run started
        run: |
          started=$(gh api "repos/$GH_REPO/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          wait=$(( $(date -d "$started" +%s) + 1800 - $(date +%s) ))
          echo "run started $started; waiting ${wait}s"
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
      - name: Dispatch the next run unless one is already waiting
        run: |
          others=$(gh run list --workflow ingest.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != \"completed\")] | length")
          if [ "$others" -gt 0 ]; then
            echo "$others other ingest run(s) queued or running; not dispatching"
          else
            gh workflow run ingest.yml --ref "${{ github.ref_name }}"
            echo "dispatched the next ingest run"
          fi
