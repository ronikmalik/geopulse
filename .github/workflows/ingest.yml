name: Ingest live events

on:
  schedule:
    # Offset from :00/:15/:30/:45 -- GitHub's own docs note scheduled
    # workflows can be delayed at exact hour/quarter-hour marks due to load.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/ingest
        run: |
          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -X GET "https://geopulse-green.vercel.app/api/ingest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $status"
          cat /tmp/body.txt
          if [ "$status" -ge 300 ]; then
            echo "Ingest request failed"
            exit 1
          fi
