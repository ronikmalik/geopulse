name: Ingest live events

# This schedule has not fired even once since it was first added on
# 2026-08-27, despite the workflow showing "active" via the GitHub API and
# the repo having no other explanation found (public, Actions enabled,
# no billing/permissions issue, no ongoing GitHub incident). cron-job.org
# is the actual primary trigger now (see docs/ARCHITECTURE.md) — this is
# only a backup. Changed the cron expression on 2026-09-04 specifically to
# force GitHub to re-register the schedule, on the chance the original
# registration was stuck; if this also never fires, the issue is GitHub's
# scheduler itself and not something fixable from this repo.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/ingest
        run: |
          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -X GET "https://geopulse-green.vercel.app/api/ingest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $status"
          cat /tmp/body.txt
          if [ "$status" -ge 300 ]; then
            echo "Ingest request failed"
            exit 1
          fi
