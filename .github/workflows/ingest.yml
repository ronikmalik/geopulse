name: Ingest live events

# This schedule did not fire even once between 2026-08-27 (when it was
# first added) and 2026-09-04, despite the workflow showing "active" via
# the GitHub API and no other explanation found (public, Actions enabled,
# no billing/permissions issue, no ongoing GitHub incident). The cron
# expression was changed on 2026-09-04 specifically to force GitHub to
# re-register the schedule, on the chance the original registration was
# stuck — and it worked: confirmed firing on schedule the same day (run
# history shows event=schedule completions). cron-job.org remains the
# primary trigger (see docs/ARCHITECTURE.md) since it's been reliable
# throughout, but this backup is now actually live, not theoretical.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call /api/ingest
        run: |
          status=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -X GET "https://geopulse-green.vercel.app/api/ingest" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          echo "HTTP $status"
          cat /tmp/body.txt
          if [ "$status" -ge 300 ]; then
            echo "Ingest request failed"
            exit 1
          fi
