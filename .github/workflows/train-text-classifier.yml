name: Train text classifier

# Weekly, same reasoning as train-risk-model.yml/train-narrative-
# clusters.yml. Offset from both so the three weekly training jobs don't
# compete for the same moment.
# In-process on the runner since 2026-09-19 (see _run-job.yml) — training
# is the one place the old 55-120s Vercel maxDuration was actually tight;
# the runner has no such clock.
on:
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  train:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: train-text-classifier
      timeout-minutes: 15
    secrets: inherit
