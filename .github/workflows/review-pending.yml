name: Review pending events

# Dedicated cadence for the pre-publish Gemini gate (2026-09-10, explicit
# user instruction: prioritize reviewPendingEvents over the backlog sweep,
# give it real leeway, decouple it from ingest). See
# PENDING_REVIEW_DEADLINE_MS in src/lib/classifierAudit.ts for the real AI
# Studio RPD/RPM numbers (490/500, 18/15) that ruled out just giving it
# MORE total daily requests. Runs in-process on the runner since
# 2026-09-19 (see _run-job.yml).
#
# Offset from ingest.yml's :04/:19/:34/:49 so a review pass always lands a
# few minutes after fresh pending rows exist.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  review-pending:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: review-pending
      timeout-minutes: 6
    secrets: inherit
