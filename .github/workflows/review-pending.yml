name: Review pending events

# Manual-dispatch entry point for the pre-publish Gemini gate. Since
# 2026-09-20 the scheduled review runs as the second job of ingest.yml,
# chained directly after each ingest, so a review pass always lands about
# a minute after fresh pending rows exist — the two used to be separate
# schedules (:04... and :07...) that GitHub jittered independently by
# ~10 min each, so in practice new rows waited anywhere from 0 to 15 min
# for review. This file stays for one-off runs (e.g. to drain a backlog
# after a Gemini outage) and keeps the workflow registered so old run
# history stays browsable.
#
# See PENDING_REVIEW_DEADLINE_MS in src/lib/classifierAudit.ts for the real
# AI Studio RPD/RPM numbers (490/500, 18/15) that ruled out just giving it
# MORE total daily requests, and GEMINI_LITE_DAILY_CAPS in src/lib/aiUsage.ts
# for the cap that bounds it regardless of how often it runs.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  review-pending:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: review-pending
      timeout-minutes: 6
    secrets: inherit
