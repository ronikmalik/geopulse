name: Generate country briefs

# Frequent cadence for AI country situation briefs (2026-09-11, user
# request — "50 refreshes every day," one call per country, descending
# pulse/risk-score order). Generates exactly ONE country's brief per call
# (see src/lib/countryBriefs.ts) and needs a cadence like this to reach
# 50/day; GEMINI_LITE_DAILY_CAPS.brief in src/lib/aiUsage.ts is what stops
# it at 50. Offset from ingest (:04...) and review-pending (:07...) so none
# of the three fire in the same minute. In-process on the runner since
# 2026-09-19 (see _run-job.yml).
on:
  schedule:
    - cron: "10,25,40,55 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  generate-briefs:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: generate-briefs
      timeout-minutes: 6
    secrets: inherit
