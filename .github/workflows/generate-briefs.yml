name: Generate country briefs

# Manual-dispatch entry point for AI country situation briefs. Since
# 2026-09-21 the scheduled brief runs as the third job of ingest.yml,
# chained after review-pending, so it shares the pipeline's one database
# wake-up per cycle instead of waking Neon on its own :10/:25/:40/:55
# offset (Neon Free is 100 CU-hours/month; the compute only saves hours
# by sleeping, and it needs 5 idle minutes to do so). Four cycles an hour
# still reaches the 50/day cap (GEMINI_LITE_DAILY_CAPS.brief in
# src/lib/aiUsage.ts) — the cap, not the cadence, is what bounds it.
# Kept for one-off runs and so old run history stays browsable.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  generate-briefs:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: generate-briefs
      timeout-minutes: 6
    secrets: inherit
