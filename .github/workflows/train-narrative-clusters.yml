name: Train narrative clusters

# Weekly, same reasoning as train-risk-model.yml — the embedded corpus
# doesn't grow fast enough (12 rows/ingest-cycle backfill, see
# embeddingBackfill.ts) to justify refitting more often. Offset from the
# Sunday-noon risk-model slot so the two don't compete.
# In-process on the runner since 2026-09-19 (see _run-job.yml) — training
# is the one place the old 55-120s Vercel maxDuration was actually tight;
# the runner has no such clock.
# 2026-10-17: manual-only. GitHub disabled Actions on this repo on 2026-10-14
# and every schedule now runs as a systemd timer on the Oracle Always Free
# VM (deploy/oracle/). Do not add a cron here: both hosts would run it.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  train:
    uses: ./.github/workflows/_run-job.yml
    with:
      job: train-narrative-clusters
      timeout-minutes: 15
    secrets: inherit
